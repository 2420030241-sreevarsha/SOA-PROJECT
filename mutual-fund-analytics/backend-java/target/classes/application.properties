# ===================================================================
# Spring Boot Configuration - Mutual Fund Analytics SOA System
# ===================================================================
server.port=8080

# Database Configuration (H2 Embedded with persistence option)
spring.datasource.url=jdbc:h2:mem:funddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console for inspection during college demo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Gemini API Key (Inject from environment variable or system property)
# Do not commit real keys in repository!
gemini.api.key=${GEMINI_API_KEY:}

# SOA Financial Assumptions
finance.risk-free-rate=6.5
